name: Build JARVIS Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'app/src/main/assets/index.html'
      - 'assets/jarvis_launcher_icon.png'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package JARVIS APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify required source files
        run: |
          set -eu
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f app/src/main/assets/index.html
          test -f android/AndroidManifest.xml
          echo "Flutter and website source files are present."
          flutter --version
          java -version

      - name: Generate Android Flutter project
        run: flutter create --platforms=android --org com.emzaro --project-name jarvis --overwrite /tmp/jarvis_flutter

      - name: Copy app source and bundled website
        run: |
          set -eu
          cp pubspec.yaml /tmp/jarvis_flutter/pubspec.yaml
          mkdir -p /tmp/jarvis_flutter/assets
          cp app/src/main/assets/index.html /tmp/jarvis_flutter/assets/index.html
          cp -r lib/. /tmp/jarvis_flutter/lib/
          cp android/AndroidManifest.xml /tmp/jarvis_flutter/android/app/src/main/AndroidManifest.xml
          mkdir -p /tmp/jarvis_flutter/android/app/src/main/kotlin/com/emzaro/jarvis
          if [ -d android/app/src/main/kotlin/com/emzaro/jarvis ]; then
            cp -r android/app/src/main/kotlin/com/emzaro/jarvis/. /tmp/jarvis_flutter/android/app/src/main/kotlin/com/emzaro/jarvis/
          fi
          if [ -d android/app/src/main/res/xml ]; then
            mkdir -p /tmp/jarvis_flutter/android/app/src/main/res/xml
            cp -r android/app/src/main/res/xml/. /tmp/jarvis_flutter/android/app/src/main/res/xml/
          fi
          if [ -d android/app/src/main/res/values ]; then
            mkdir -p /tmp/jarvis_flutter/android/app/src/main/res/values
            cp -r android/app/src/main/res/values/. /tmp/jarvis_flutter/android/app/src/main/res/values/
          fi

      - name: Install exact repository launcher icon
        run: |
          python3 -m pip install --break-system-packages --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source_path = Path('assets/jarvis_launcher_icon.png')
          res = Path('/tmp/jarvis_flutter/android/app/src/main/res')
          if not source_path.is_file():
              print('No committed launcher icon found; keeping Flutter default.')
              raise SystemExit(0)
          try:
              with Image.open(source_path) as image:
                  source = image.convert('RGBA')
                  source.load()
              sizes = {'mipmap-mdpi':48, 'mipmap-hdpi':72, 'mipmap-xhdpi':96, 'mipmap-xxhdpi':144, 'mipmap-xxxhdpi':192}
              for folder, size in sizes.items():
                  dest = res / folder
                  dest.mkdir(parents=True, exist_ok=True)
                  icon = source.resize((size, size), Image.Resampling.LANCZOS)
                  icon.save(dest / 'ic_launcher.png', optimize=True)
                  icon.save(dest / 'ic_launcher_round.png', optimize=True)
              for adaptive in (res / 'mipmap-anydpi-v26' / 'ic_launcher.xml', res / 'mipmap-anydpi-v26' / 'ic_launcher_round.xml'):
                  if adaptive.exists():
                      adaptive.unlink()
              print('Installed exact repository JARVIS launcher artwork.')
          except Exception as exc:
              print(f'WARNING: could not install committed icon: {exc}')
          PY

      - name: Resolve Flutter dependencies
        working-directory: /tmp/jarvis_flutter
        run: flutter pub get

      - name: Build debug APK
        working-directory: /tmp/jarvis_flutter
        run: flutter build apk --debug --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-flutter-debug-apk
          path: /tmp/jarvis_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
