name: Build JARVIS Flutter APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/AndroidManifest.xml'
      - 'android/app/src/main/kotlin/**'
      - 'assets/jarvis_launcher_icon.png'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android Flutter project
        run: flutter create --platforms=android --org com.emzaro --project-name jarvis --overwrite /tmp/jarvis_flutter
      - name: Install Flutter app source
        run: |
          cp pubspec.yaml /tmp/jarvis_flutter/pubspec.yaml
          cp -r lib/. /tmp/jarvis_flutter/lib/
          cp android/AndroidManifest.xml /tmp/jarvis_flutter/android/app/src/main/AndroidManifest.xml
          mkdir -p /tmp/jarvis_flutter/android/app/src/main/kotlin/com/emzaro/jarvis
          cp android/app/src/main/kotlin/com/emzaro/jarvis/MainActivity.kt /tmp/jarvis_flutter/android/app/src/main/kotlin/com/emzaro/jarvis/MainActivity.kt
          cp android/app/src/main/kotlin/com/emzaro/jarvis/JarvisOverlayService.kt /tmp/jarvis_flutter/android/app/src/main/kotlin/com/emzaro/jarvis/JarvisOverlayService.kt
          python3 -m pip install --break-system-packages --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import shutil
          source = Image.open('assets/jarvis_launcher_icon.png').convert('RGBA')
          res = Path('/tmp/jarvis_flutter/android/app/src/main/res')
          sizes = {'mipmap-mdpi':48, 'mipmap-hdpi':72, 'mipmap-xhdpi':96, 'mipmap-xxhdpi':144, 'mipmap-xxxhdpi':192}
          for folder, size in sizes.items():
              dest = res / folder
              dest.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(dest / 'ic_launcher.png', optimize=True)
              icon.save(dest / 'ic_launcher_round.png', optimize=True)
          # Use the supplied artwork as the icon on all Android versions.
          for adaptive in (res / 'mipmap-anydpi-v26' / 'ic_launcher.xml', res / 'mipmap-anydpi-v26' / 'ic_launcher_round.xml'):
              if adaptive.exists(): adaptive.unlink()
          print('Installed supplied JARVIS icon into Android launcher resources.')
          PY
          cd /tmp/jarvis_flutter
          flutter pub get
      - name: Install stable Android NDK
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "NDK installation failed after 3 attempts"
              exit 1
            fi
            echo "NDK download failed; retrying in 10 seconds..."
            sleep 10
          done
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' /tmp/jarvis_flutter/android/app/build.gradle.kts
          grep -n 'ndkVersion' /tmp/jarvis_flutter/android/app/build.gradle.kts
      - name: Build APK
        run: cd /tmp/jarvis_flutter && flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-flutter-debug-apk
          path: /tmp/jarvis_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
